<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Carousel — Nord</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200;12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #242933;
            --bg-card: #3B4252;
            --text-primary: #ECEFF4;
            --text-muted: #8189A3;
            --text-secondary: #C8D0E0;
            --accent-cyan: #88C0D0;
            --accent-mint: #A3BE8C;
            --border-subtle: rgba(236, 239, 244, 0.08);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.35);
            --shadow-card-hover: 0 16px 48px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(136, 192, 208, 0.25);
            --font-display: 'Bricolage Grotesque', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --card-width: 380px;
            --card-height: 260px;
            --card-gap: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-display);
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            background:
                radial-gradient(ellipse 80% 60% at 20% 15%, rgba(136, 192, 208, 0.10) 0%, transparent 55%),
                radial-gradient(ellipse 60% 70% at 85% 80%, rgba(143, 188, 187, 0.09) 0%, transparent 55%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(129, 161, 193, 0.06) 0%, transparent 60%),
                var(--bg-deep);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-size: 200px 200px;
            animation: grain 8s steps(3) infinite;
        }
        @keyframes grain {
            0%,
            100% {
                background-position: 0 0;
            }
            33% {
                background-position: 30px -15px;
            }
            66% {
                background-position: -20px 20px;
            }
        }

        #root {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1280px;
            padding: 40px 24px;
        }

        /* ── Header ── */
        .carousel-header {
            text-align: center;
            margin-bottom: 36px;
        }
        .carousel-header .eyebrow {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 8px;
        }
        .carousel-header h2 {
            font-weight: 700;
            font-size: clamp(1.8rem, 3.5vw, 2.6rem);
            letter-spacing: -0.02em;
            line-height: 1.15;
        }
        .carousel-header .divider {
            display: inline-block;
            width: 48px;
            height: 3px;
            background: var(--accent-cyan);
            border-radius: 2px;
            margin-top: 12px;
            opacity: 0.7;
        }

        /* ── Carousel Shell ── */
        .carousel-shell {
            position: relative;
            width: 100%;
            overflow: hidden;
        }
        .carousel-viewport {
            overflow: hidden;
            cursor: grab;
            border-radius: 12px;
            user-select: none;
            touch-action: pan-y;
        }
        .carousel-viewport.dragging {
            cursor: grabbing;
        }
        .carousel-track {
            display: flex;
            gap: var(--card-gap);
            padding: 8px 0;
            will-change: transform;
        }

        /* ── Event Card ── */
        .event-card {
            flex-shrink: 0;
            width: var(--card-width);
            height: var(--card-height);
            background: var(--bg-card);
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-card);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: border-color 0.35s ease, box-shadow 0.35s ease;
        }
        .event-card:hover {
            border-color: rgba(136, 192, 208, 0.35);
            box-shadow: var(--shadow-card-hover);
        }

        .card-visual {
            height: 95px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .card-visual::after {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.15;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.03) 2px, rgba(255, 255, 255, 0.03) 3px);
            pointer-events: none;
        }

        /* Accent stripe per card — use inline style for the gradient */
        .date-badge {
            position: absolute;
            top: 12px;
            left: 14px;
            background: rgba(36, 41, 51, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 22px;
            padding: 5px 14px;
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: var(--text-primary);
            z-index: 2;
            white-space: nowrap;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .card-body {
            flex: 1;
            padding: 14px 16px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-body .event-title {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: -0.01em;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .card-body .event-desc {
            font-weight: 300;
            font-size: 0.78rem;
            color: var(--text-muted);
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        .card-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(236, 239, 244, 0.07);
        }
        .card-meta .location {
            font-family: var(--font-mono);
            font-size: 0.63rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .loc-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-mint);
            flex-shrink: 0;
        }
        .card-meta .time {
            font-family: var(--font-mono);
            font-size: 0.63rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            color: var(--accent-cyan);
        }
        .card-arrow {
            position: absolute;
            bottom: 14px;
            right: 16px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(136, 192, 208, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s ease;
            pointer-events: none;
        }
        .event-card:hover .card-arrow {
            opacity: 1;
            transform: translateX(0);
            background: rgba(136, 192, 208, 0.22);
        }
        .card-arrow svg {
            width: 13px;
            height: 13px;
            stroke: var(--accent-cyan);
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Nav Arrows ── */
        .nav-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(59, 66, 82, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(236, 239, 244, 0.14);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.25s, border-color 0.25s, transform 0.25s, box-shadow 0.25s;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }
        .nav-arrow:hover {
            background: rgba(76, 86, 106, 0.85);
            border-color: rgba(136, 192, 208, 0.5);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(136, 192, 208, 0.2);
        }
        .nav-arrow:active {
            transform: translateY(-50%) scale(0.93);
        }
        .nav-arrow.disabled {
            opacity: 0.3;
            pointer-events: none;
        }
        .nav-arrow-left {
            left: 0;
        }
        .nav-arrow-right {
            right: 0;
        }
        .nav-arrow svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-primary);
            stroke-width: 2.5;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* ── Dots ── */
        .dot-indicators {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 10px;
            background: rgba(236, 239, 244, 0.2);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            padding: 0;
        }
        .dot.active {
            width: 26px;
            background: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(136, 192, 208, 0.5);
        }
        .dot:hover:not(.active) {
            background: rgba(236, 239, 244, 0.4);
        }

        @media (max-width: 768px) {
            :root {
                --card-width: 290px;
                --card-height: 220px;
                --card-gap: 12px;
            }
            .nav-arrow {
                width: 34px;
                height: 34px;
            }
            .nav-arrow svg {
                width: 13px;
                height: 13px;
            }
            .card-visual {
                height: 70px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .event-card,
            .card-arrow,
            .nav-arrow,
            .carousel-track {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }
            body::before {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Import Map for ESM modules -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "framer-motion": "https://esm.sh/framer-motion@10.18.0"
            }
        }
    </script>

    <!-- Babel Standalone to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone@7.23.9/babel.min.js"></script>

    <!-- Application code with JSX (transpiled by Babel) -->
    <script type="text/babel" data-type="module" data-presets="react">
        import React, { useState, useCallback, useMemo } from "react";
        import { createRoot } from "react-dom/client";
        import { motion } from "framer-motion";

        // ── Event Data ──
        const eventsData = [
            {
                id: 0,
                title: "Neon Nights Music Festival",
                desc: "Three stages of electronic, indie, and ambient performances under the Miami stars.",
                date: "Dec 15, 2026",
                time: "6:00 PM",
                location: "Miami, FL",
                gradient: "linear-gradient(135deg, #88C0D0 0%, #5E81AC 40%, #81A1C1 100%)",
            },
            {
                id: 1,
                title: "AI Frontiers Summit 2026",
                desc: "Industry leaders explore the next wave of generative AI and its enterprise impact.",
                date: "Jan 22, 2027",
                time: "9:00 AM",
                location: "San Francisco, CA",
                gradient: "linear-gradient(150deg, #8FBCBB 0%, #5E81AC 50%, #88C0D0 100%)",
            },
            {
                id: 2,
                title: "Design Systems Conf",
                desc: "A gathering of design engineers shaping the future of component-driven interfaces.",
                date: "Feb 8, 2027",
                time: "10:00 AM",
                location: "Berlin, Germany",
                gradient: "linear-gradient(120deg, #A3BE8C 0%, #8FBCBB 40%, #81A1C1 100%)",
            },
            {
                id: 3,
                title: "Mountain Code Retreat",
                desc: "Write code at 9,000 ft. Workshops, fireside chats, and alpine pair programming.",
                date: "Mar 5, 2027",
                time: "8:00 AM",
                location: "Aspen, CO",
                gradient: "linear-gradient(135deg, #81A1C1 0%, #B48EAD 45%, #88C0D0 100%)",
            },
            {
                id: 4,
                title: "Culinary Innovation Expo",
                desc: "Chefs and food-tech pioneers showcase the future of gastronomy and kitchen AI.",
                date: "Mar 18, 2027",
                time: "11:00 AM",
                location: "Tokyo, Japan",
                gradient: "linear-gradient(125deg, #D08770 0%, #EBCB8B 40%, #BF616A 100%)",
            },
            {
                id: 5,
                title: "Sustainable Future Forum",
                desc: "Policy makers and green-tech founders chart the path to net-zero cities.",
                date: "Apr 2, 2027",
                time: "9:30 AM",
                location: "Copenhagen, Denmark",
                gradient: "linear-gradient(140deg, #B48EAD 0%, #88C0D0 40%, #8FBCBB 100%)",
            },
            {
                id: 6,
                title: "Indie Game Showcase",
                desc: "50+ independent studios debut their latest titles in an arcade-style expo hall.",
                date: "Apr 20, 2027",
                time: "12:00 PM",
                location: "Austin, TX",
                gradient: "linear-gradient(130deg, #EBCB8B 0%, #D08770 35%, #BF616A 100%)",
            },
            {
                id: 7,
                title: "Wellness & Mindfulness Summit",
                desc: "Meditation leaders and neuroscientists converge for a weekend of calm and clarity.",
                date: "May 10, 2027",
                time: "7:00 AM",
                location: "Bali, Indonesia",
                gradient: "linear-gradient(115deg, #5E81AC 0%, #88C0D0 40%, #81A1C1 100%)",
            },
        ];

        // ── Event Card ──
        const EventCard = React.memo(({ event, index }) => {
            return (
                <motion.div
                    className="event-card"
                    initial={{ opacity: 0, y: 40, scale: 0.94 }}
                    animate={{ opacity: 1, y: 0, scale: 1 }}
                    transition={{
                        delay: index * 0.08,
                        type: "spring",
                        stiffness: 180,
                        damping: 24,
                        mass: 0.7,
                    }}
                    whileHover={{ y: -8, scale: 1.025 }}
                    whileTap={{ scale: 0.975 }}
                    layout
                >
                    <div
                        className="card-visual"
                        style={{ background: event.gradient }}
                    >
                        <span className="date-badge">{event.date}</span>
                    </div>
                    <div className="card-body">
                        <h3 className="event-title">{event.title}</h3>
                        <p className="event-desc">{event.desc}</p>
                        <div className="card-meta">
                            <span className="location">
                                <span className="loc-dot"></span>
                                {event.location}
                            </span>
                            <span className="time">{event.time}</span>
                        </div>
                        <div className="card-arrow">
                            <svg viewBox="0 0 24 24">
                                <polyline points="9 6 15 12 9 18" />
                            </svg>
                        </div>
                    </div>
                </motion.div>
            );
        });
        EventCard.displayName = "EventCard";

        // ── Carousel ──
        function EventCarousel() {
            const [index, setIndex] = useState(0);
            const [isDragging, setIsDragging] = useState(false);
            const cardStep = 380 + 20; // card-width + card-gap
            const maxIndex = Math.max(0, eventsData.length - 1);

            const dragConstraints = useMemo(
                () => ({
                    left: -maxIndex * cardStep,
                    right: 0,
                }),
                [maxIndex, cardStep]
            );

            const handleDragStart = useCallback(() => setIsDragging(true), []);
            const handleDragEnd = useCallback(
                (_, info) => {
                    setIsDragging(false);
                    const currentX = -index * cardStep + info.offset.x;
                    let nearest = Math.round(-currentX / cardStep);
                    nearest = Math.max(0, Math.min(nearest, maxIndex));

                    if (Math.abs(info.velocity.x) > 400) {
                        nearest = info.velocity.x > 0
                            ? Math.max(0, index - 1)
                            : Math.min(maxIndex, index + 1);
                    }
                    setIndex(nearest);
                },
                [index, maxIndex, cardStep]
            );

            const goNext = () => setIndex((p) => Math.min(p + 1, maxIndex));
            const goPrev = () => setIndex((p) => Math.max(p - 1, 0));

            return (
                <div className="carousel-shell">
                    {/* Left Arrow */}
                    <button
                        className={`nav-arrow nav-arrow-left${index === 0 ? " disabled" : ""}`}
                        onClick={goPrev}
                        disabled={index === 0}
                        aria-label="Previous events"
                    >
                        <svg viewBox="0 0 24 24">
                            <polyline points="15 6 9 12 15 18" />
                        </svg>
                    </button>

                    {/* Right Arrow */}
                    <button
                        className={`nav-arrow nav-arrow-right${index >= maxIndex ? " disabled" : ""}`}
                        onClick={goNext}
                        disabled={index >= maxIndex}
                        aria-label="Next events"
                    >
                        <svg viewBox="0 0 24 24">
                            <polyline points="9 6 15 12 9 18" />
                        </svg>
                    </button>

                    {/* Viewport */}
                    <div className={`carousel-viewport${isDragging ? " dragging" : ""}`}>
                        <motion.div
                            className="carousel-track"
                            drag="x"
                            dragConstraints={dragConstraints}
                            dragElastic={0.08}
                            dragMomentum={true}
                            dragTransition={{ bounceStiffness: 200, bounceDamping: 28, power: 0.22 }}
                            onDragStart={handleDragStart}
                            onDragEnd={handleDragEnd}
                            animate={{ x: -index * cardStep }}
                            transition={{
                                type: "spring",
                                stiffness: 280,
                                damping: 30,
                                mass: 0.6,
                            }}
                            style={{ userSelect: "none" }}
                        >
                            {eventsData.map((event, i) => (
                                <EventCard key={event.id} event={event} index={i} />
                            ))}
                        </motion.div>
                    </div>

                    {/* Dot Indicators */}
                    <div className="dot-indicators">
                        {eventsData.map((_, i) => (
                            <button
                                key={i}
                                className={`dot${i === index ? " active" : ""}`}
                                onClick={() => setIndex(i)}
                                aria-label={`Go to event ${i + 1}`}
                            />
                        ))}
                    </div>
                </div>
            );
        }

        // ── App Shell ──
        function App() {
            return (
                <>
                    <div className="carousel-header">
                        <p className="eyebrow">Discover &amp; Attend</p>
                        <h2>Upcoming Events</h2>
                        <div className="divider"></div>
                    </div>
                    <EventCarousel />
                </>
            );
        }

        // ── Mount ──
        const container = document.getElementById("root");
        const root = createRoot(container);
        root.render(
            <React.StrictMode>
                <App />
            </React.StrictMode>
        );
    </script>
</body>
</html>
