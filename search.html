<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results — Department of Computer Engineering</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<%- include('partials/header.html', { prefix: '', activeTab: '', activeSub: '' }) %>

<section class="subpage-section">
    <div class="subpage-container">
        <div class="placeholder-card">
            <span class="placeholder-icon">🔍</span>
            <h1 class="placeholder-title">Search Results</h1>
            <p class="placeholder-text" id="search-results-message">Search results — coming soon</p>
            <a href="index.html" class="placeholder-btn">Back to Home</a>
        </div>
    </div>
</section>

<script>
    // Read the query parameter and display it dynamically
    const params = new URLSearchParams(window.location.search);
    const query = params.get('q');
    const messageEl = document.getElementById('search-results-message');
    if (query && messageEl) {
        // Sanitize input to prevent XSS
        const safeQuery = query.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
        messageEl.innerHTML = 'Search results for "<strong>' + safeQuery + '</strong>" — coming soon';
    }
</script>
