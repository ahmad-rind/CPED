<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><%= title %> — Department of Computer Engineering</title>
    
    <!-- Google Fonts Preconnect Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for crisp icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="<%= prefix %>css/styles.css">
</head>
<body>

<%- include('partials/header.html', { prefix: prefix, activeTab: activeTab, activeSub: activeSub }) %>

<section class="subpage-section">
    <div class="subpage-container">
        <div class="placeholder-card">
            <span class="placeholder-icon">
                <% if (icon.startsWith('fa-')) { %>
                    <i class="fa-solid <%= icon %>"></i>
                <% } else { %>
                    <%= icon %>
                <% } %>
            </span>
            <h1 class="placeholder-title" style="margin-bottom: 20px;"><%= title %></h1>
            <p class="placeholder-text"><%= description %></p>
            <a href="<%= prefix %>index.html" class="placeholder-btn">Back to Home</a>
        </div>
    </div>
</section>

<%- include('partials/footer.html', { prefix: prefix }) %>
</body>
</html>
